app:
  # data/ 폴더 위치. backend 폴더에서 실행하는 것을 기준으로 한다.
  data-dir: ${DATA_DIR:../data}
  llm:
    timeout-seconds: 50
    max-tool-calls: 6
  session:
    ttl-minutes: 30

spring:
  application:
    name: jeju-agent
  datasource:
    url: jdbc:duckdb:${app.data-dir}/jeju.duckdb
    driver-class-name: org.duckdb.DuckDBDriver
  # LLM 공급자 설정은 공급자 starter를 정한 뒤 추가한다.
  # 키는 반드시 ${LLM_API_KEY}, 모델은 ${LLM_MODEL:기본값}으로만 읽는다.
