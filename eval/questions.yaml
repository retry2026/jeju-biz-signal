# 평가 질문 30개 (① 소유)
# 형식: docs/API명세.md 7장
#
# 구성: 답변 20 (ANSWER) + 거절·대안 5 (REFUSE) + 되묻기 5 (ASK_BACK)
#
# 만든 기준
#  1. area는 ref_area의 행정동코드 8자리, industry는 ref_industry의 7개 코드만 쓴다.
#     화면 드롭다운이 보내는 값과 같아야 하고, 없는 코드는 IllegalArgumentException이 된다.
#  2. (지역 × 업종) 조합은 v_store에 점포가 25개 이상인 것만 골랐다.
#     점포가 없는 조합을 물으면 지표가 아니라 입력 오류를 검증하게 된다.
#  3. numbers가 붙은 문항은 eval/gold에 정답 SQL이 있는 조합으로만 맞췄다.
#     gold 11개가 노형동·애월읍·연동·제주 전체 CAFE·KOREAN·입도객에 걸려 있어
#     Q01~Q09가 그 조합을 쓴다. 나머지 답변 문항은 tools 호출만 검증한다.
#  4. REFUSE 5개는 "데이터에 축 자체가 없는 질문"으로만 구성했다.
#     시간대, 업력, 개별 점포 매출, 소득, 배달 구분은 S1~S4 어디에도 없다.
#     없는 것을 지어내지 않는지 보는 문항이라 5개 모두 성격이 다르다.
#  5. ASK_BACK 5개는 area·industry가 @NotBlank라 비울 수 없으므로
#     message가 막연하거나(MESSAGE) 기존 사업자가 월매출을 안 낸 경우(MY_STORE)로 만들었다.
#
# tolerance 기준: 점포 수 0, 배수 0.1, 비율·지수·증감률 0.5

# ── 답변 · 정답 SQL 대조 (Q01~Q09) ──────────────────────────────

- id: Q01
  scenario: A
  request:
    userType: STARTUP
    area: "50110660"
    industry: CAFE
    myStore: null
    message: "노형동에 카페를 차리려고 하는데 경쟁이 심한가요?"
  expect:
    type: ANSWER
    tools: [competition]
