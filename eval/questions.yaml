# ── 거절·대안 (Q21~Q25) ─────────────────────────────────────────
# 전부 S1~S4에 축 자체가 없는 질문이다. 없는 숫자를 지어내지 않는지 본다.

- id: Q21
  scenario: REFUSE
  request:
    userType: STARTUP
    area: "50110660"
    industry: CAFE
    myStore: null
    message: "저녁 장사가 나을까요, 점심 장사가 나을까요?"
  expect:
    type: REFUSE
    tools: []
    # 근거: 시간대 축이 없다. S2는 월 단위, S3도 월 단위, S4는 일 단위다.

- id: Q22
